description: >-
  Good design without the bids queue and worker. Each API instance checks the current
  highest bid and writes a new one itself, so two bids in the same moment can both win.
design:
  nodes:
    - { id: phone, kind: mobile, label: Student phone }
    - { id: laptop, kind: desktop, label: Student laptop }
    - { id: lb, kind: load_balancer }
    - { id: api-1, kind: paas, label: Auction API 1 }
    - { id: api-2, kind: paas, label: Auction API 2 }
    - { id: cache, kind: cache, label: Item cache, config: { memoryGb: 6 } }
    - { id: db, kind: database, label: Auction DB, config: { replicas: 2 } }
  edges:
    - phone -> lb : http
    - laptop -> lb : http
    - lb -> api-1 : http
    - lb -> api-2 : http
    - api-1 -> cache : db
    - api-2 -> cache : db
    - api-1 -> db : db
    - api-2 -> db : db
    - api-1 -> phone : sse
    - api-2 -> phone : sse
    - api-1 -> laptop : sse
    - api-2 -> laptop : sse
  placements:
    browse-items: api-1
    place-bid: api-1
    watch-item: api-2
expect:
  fails: [bids-queued, bid-worker]
