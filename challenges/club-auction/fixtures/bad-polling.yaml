description: >-
  Good design without the push. Every phone and laptop watching an item asks the API
  for its price again every few seconds.
design:
  nodes:
    - { id: phone, kind: mobile, label: Student phone }
    - { id: laptop, kind: desktop, label: Student laptop }
    - { id: lb, kind: load_balancer }
    - { id: api-1, kind: paas, label: Auction API 1 }
    - { id: api-2, kind: paas, label: Auction API 2 }
    - { id: bids, kind: message_queue, label: Bids }
    - { id: judge, kind: task_worker, label: Bid worker }
    - { id: cache, kind: cache, label: Item cache, config: { memoryGb: 6 } }
    - { id: db, kind: database, label: Auction DB, config: { replicas: 2 } }
  edges:
    - phone -> lb : http
    - laptop -> lb : http
    - lb -> api-1 : http
    - lb -> api-2 : http
    - api-1 -> bids : http
    - api-2 -> bids : http
    - bids -> judge : http
    - judge -> db : db
    - api-1 -> cache : db
    - api-2 -> cache : db
    - api-1 -> db : db
    - api-2 -> db : db
  placements:
    browse-items: api-1
    place-bid: api-1
    watch-item: api-2
expect:
  fails: [live-price, nfr-throughput]
