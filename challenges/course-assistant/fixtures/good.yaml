description: >-
  Reference design. Students' laptops reach two API instances through a load
  balancer. The APIs call the external model API, stream each answer back to the
  laptop over SSE, and store conversations in a replicated database with a cache
  for recent ones.
design:
  nodes:
    - { id: laptop, kind: desktop, label: Student laptop }
    - { id: lb, kind: load_balancer }
    - { id: api-1, kind: paas, label: Assistant API 1 }
    - { id: api-2, kind: paas, label: Assistant API 2 }
    - { id: llm, kind: external_api, label: AI model API }
    - { id: cache, kind: cache, label: Recent conversations, config: { memoryGb: 3 } }
    - { id: db, kind: database, label: Conversations DB, config: { replicas: 2 } }
  edges:
    - laptop -> lb : http
    - lb -> api-1 : http
    - lb -> api-2 : http
    - api-1 -> llm : http
    - api-2 -> llm : http
    - api-1 -> laptop : sse
    - api-2 -> laptop : sse
    - api-1 -> cache : db
    - api-2 -> cache : db
    - api-1 -> db : db
    - api-2 -> db : db
  placements:
    ask-question: api-1
    history: api-2
expect:
  pass: true
