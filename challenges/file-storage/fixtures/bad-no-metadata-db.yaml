description: >-
  Good design without the database. Submission records have nowhere durable to live,
  so listing submissions means scanning object storage.
design:
  nodes:
    - { id: laptop, kind: desktop, label: Student laptop }
    - { id: ta-pc, kind: desktop, label: TA machine }
    - { id: cdn, kind: cdn, label: Download CDN }
    - { id: lb, kind: load_balancer }
    - { id: api-1, kind: paas, label: Submissions API 1 }
    - { id: api-2, kind: paas, label: Submissions API 2 }
    - { id: cache, kind: cache, label: Metadata cache, config: { memoryGb: 4 } }
    - { id: files, kind: object_storage, label: Submission files, config: { storageGb: 500 } }
  edges:
    - laptop -> lb : http
    - ta-pc -> lb : http
    - ta-pc -> cdn : http
    - cdn -> files : http
    - lb -> api-1 : http
    - lb -> api-2 : http
    - api-1 -> cache : db
    - api-2 -> cache : db
    - api-1 -> files : http
    - api-2 -> files : http
  placements:
    upload-submission: api-1
    list-submissions: api-1
    download-file: api-2
expect:
  fails: [metadata-db]
