description: >-
  Good design without the queue and workers. The API makes the thumbnails itself before
  answering the member who posted.
design:
  nodes:
    - { id: phone, kind: mobile, label: Member phone }
    - { id: laptop, kind: desktop, label: Student laptop }
    - { id: cdn, kind: cdn, label: Photo CDN }
    - { id: lb, kind: load_balancer }
    - { id: api-1, kind: paas, label: Wall API 1 }
    - { id: api-2, kind: paas, label: Wall API 2 }
    - { id: cache, kind: cache, label: Wall cache, config: { memoryGb: 5 } }
    - { id: db, kind: database, label: Photos DB, config: { replicas: 2 } }
    - { id: photos, kind: object_storage, label: Photos }
  edges:
    - phone -> lb : http
    - laptop -> lb : http
    - phone -> photos : http
    - phone -> cdn : http
    - laptop -> cdn : http
    - cdn -> photos : http
    - lb -> api-1 : http
    - lb -> api-2 : http
    - api-1 -> cache : db
    - api-2 -> cache : db
    - api-1 -> db : db
    - api-2 -> db : db
    - api-1 -> photos : http
    - api-2 -> photos : http
  placements:
    post-photo: api-1
    browse-wall: api-2
    view-photo: api-2
expect:
  fails: [thumbnails-queued, workers-thumbnail, nfr-latency]
