description: >-
  Reference design. Students' phones and laptops call an API on cloud functions, which
  keeps watches and prices in a replicated database with a small cache for price
  history. Adding a watch queues a price check; workers call the bookstore, record the
  price and push a notification when it drops below the target.
design:
  nodes:
    - { id: phone, kind: mobile, label: Student phone }
    - { id: laptop, kind: desktop, label: Student laptop }
    - { id: fn, kind: functions, label: Watch API }
    - { id: cache, kind: cache, label: Price cache, config: { memoryGb: 1 } }
    - { id: db, kind: database, label: Prices DB, config: { replicas: 2 } }
    - { id: checks, kind: message_queue, label: Price checks }
    - { id: checkers, kind: task_worker, label: Price checkers }
    - { id: store, kind: external_api, label: Online bookstore }
  edges:
    - phone -> fn : http
    - laptop -> fn : http
    - fn -> cache : db
    - fn -> db : db
    - fn -> checks : http
    - checks -> checkers : http
    - checkers -> store : http
    - checkers -> db : db
    - checkers -> phone : web_push
  placements:
    add-watch: fn
    price-history: fn
expect:
  pass: true
