description: >-
  Good design without the provider's callback. Credits are added when the
  student's browser comes back saying the payment worked, which anyone can fake.
design:
  nodes:
    - { id: phone, kind: mobile, label: Student phone }
    - { id: laptop, kind: desktop, label: Student laptop }
    - { id: lb, kind: load_balancer }
    - { id: api-1, kind: paas, label: Credits API 1 }
    - { id: api-2, kind: paas, label: Credits API 2 }
    - { id: provider, kind: external_api, label: Payment provider }
    - { id: cache, kind: cache, label: Balance cache, config: { memoryGb: 1 } }
    - { id: db, kind: database, label: Ledger DB, config: { replicas: 2 } }
  edges:
    - phone -> lb : http
    - laptop -> lb : http
    - lb -> api-1 : http
    - lb -> api-2 : http
    - api-1 -> provider : http
    - api-2 -> provider : http
    - api-1 -> cache : db
    - api-2 -> cache : db
    - api-1 -> db : db
    - api-2 -> db : db
  placements:
    start-payment: api-1
    payment-confirmed: api-2
    view-balance: api-2
expect:
  fails: [webhook-to-server]
