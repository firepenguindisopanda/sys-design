description: >-
  Good design without the load balancer. Each client is wired to one instance, so
  load is uneven and losing that instance cuts those clients off.
design:
  nodes:
    - { id: phone, kind: mobile, label: Student phone }
    - { id: lab-pc, kind: desktop, label: Lab machine }
    - { id: api-1, kind: paas, label: Link API 1 }
    - { id: api-2, kind: paas, label: Link API 2 }
    - { id: cache, kind: cache, label: Link cache, config: { memoryGb: 6 } }
    - { id: db, kind: database, label: Links DB, config: { replicas: 2 } }
  edges:
    - phone -> api-1 : http
    - lab-pc -> api-2 : http
    - api-1 -> cache : db
    - api-2 -> cache : db
    - api-1 -> db : db
    - api-2 -> db : db
  placements:
    create-link: api-1
    redirect: api-2
expect:
  fails: [nfr-availability]
  warns: [topo-lb]
